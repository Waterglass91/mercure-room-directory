<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Votre projet de séminaire | Mercure Le Plessis-Robinson</title>
  <meta name="description" content="Décrivez votre projet de séminaire et transmettez votre demande à notre service commercial.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="brandbar">
      <div>
        <p class="eyebrow">Mercure Le Plessis-Robinson</p>
        <h1>Votre projet de séminaire</h1>
        <p class="intro">Quelques questions pour transmettre une demande claire à notre service commercial.</p>
      </div>
      <div class="pill">Espace disponible de 09h00 à 23h00</div>
    </header>

    <div class="progress-wrap">
      <div class="progress-meta"><span id="stepLabel">Bienvenue</span><span id="stepCount"></span></div>
      <div class="progress"><span id="progressBar"></span></div>
    </div>

    <section class="card"><div id="app"></div></section>
    <p class="footer-note">Votre demande sera étudiée avant toute confirmation définitive.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
